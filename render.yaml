# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this
# file and provisions the web service + database together, with the
# env vars below already wired up. You only need to fill in the
# PAYFAST_* secrets and SECRET_KEY afterwards (marked sync: false,
# so Render prompts for them instead of storing them in git).
#
# Custom domain (mzansi-link.co.za): add it under the web service's
# Settings -> Custom Domains once the first deploy is live, then add
# the CNAME/A record Render shows you at your domain registrar. See
# README.md for the full walkthrough.

databases:
  - name: mzansi-link-db
    plan: free
    databaseName: mzansilink
    user: mzansilink

services:
  - type: web
    name: mzansi-link
    runtime: python
    plan: free
    # ensure_admin creates the admin login from the ADMIN_* env vars below
    # (the free tier has no Shell to run createsuperuser by hand).
    # sync_demo_data loads the demo accounts while SEED_DEMO_DATA=1 and
    # removes them otherwise — flip it in Render's Environment tab.
    # All of these are safe to run on every deploy.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ensure_admin && python manage.py sync_demo_data"
    startCommand: "gunicorn config.wsgi:application"
    # Uploaded photos are stored in the database (MEDIA_IN_DB below), so
    # Render's wiped-on-deploy filesystem can't lose them. No disk needed.
    envVars:
      # Render defaults new Python services to the latest Python
      # (3.14 at the time of writing) — Pillow doesn't ship a
      # prebuilt wheel for it yet, so pip tries to compile it from
      # source and fails. Pin to a version both Django 5.0 and
      # Pillow 10.3 fully support instead of chasing wheel coverage.
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: MEDIA_IN_DB
        value: "1"
      # 1 = demo accounts on the live site (for testing). Set to 0, and
      # redeploy, before real members join: they all share a public password.
      - key: SEED_DEMO_DATA
        value: "1"
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "mzansi-link.co.za,www.mzansi-link.co.za,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mzansi-link.co.za,https://www.mzansi-link.co.za"
      - key: USE_POSTGRES
        value: "1"
      - key: DB_NAME
        fromDatabase: { name: mzansi-link-db, property: database }
      - key: DB_USER
        fromDatabase: { name: mzansi-link-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mzansi-link-db, property: password }
      - key: DB_HOST
        fromDatabase: { name: mzansi-link-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mzansi-link-db, property: port }
      # Admin login for /admin/ and the staff dashboard. Values are typed
      # into Render's Environment tab, never stored in git.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYFAST_MODE
        value: "live"
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_RETURN_URL
        value: "https://mzansi-link.co.za/payments/success/"
      - key: PAYFAST_CANCEL_URL
        value: "https://mzansi-link.co.za/payments/cancelled/"
      - key: PAYFAST_NOTIFY_URL
        value: "https://mzansi-link.co.za/payments/itn/"
