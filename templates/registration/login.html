{% extends "base.html" %}
{% load static %}
{% block title %}Log in — Mzansi Link{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-blob auth-blob--1"></div>
  <div class="auth-blob auth-blob--2"></div>

  <div class="card auth-card">
    <img class="auth-logo" src="{% static 'img/logo-full.png' %}" alt="Mzansi Link" width="190" height="130">
    <span class="lp-pill"><span class="lp-pill-heart">&#10084;</span> Welcome back</span>
    <h1>Good to see you again.</h1>
    <p class="muted auth-sub">Pick up right where you left off.</p>

    <form method="post" action="{% url 'login' %}?next={% url 'post_login_redirect' %}">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" required>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="muted auth-foot">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
